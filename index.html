<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario - Circular Reservada</title>
    <link rel="stylesheet" href="style.css">
    <!-- TinyMCE Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.3/tinymce.min.js"></script>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <h1>Carga de Circular Reservada</h1>
            <p>Complete los datos del formulario. Los campos con asterisco (*) son obligatorios.</p>
        </header>

        <form id="circularForm">
            
            <!-- SECCIÓN 1: Datos Emisor y Fechas -->
            <div class="form-group">
                <label>Unidad Organizativa emisora <span class="required">*</span></label>
                <input type="text" id="unidadEmisora" required>
            </div>

            <div class="form-group">
                <label>Para gestionar la solicitud del proyecto de circular, indique su cargo de revista <span class="required">*</span></label>
                <select id="cargoRevista" required>
                    <option value="" disabled selected>Buscar elementos</option>
                    <option value="Jefe Principal de Departamento">Jefe Principal de Departamento</option>
                    <option value="Gerente">Gerente</option>
                    <option value="Director">Director</option>
                </select>
            </div>

            <div class="form-group">
                <label>Ingrese correos de quienes desee dejar en copia al envío del presente</label>
                <input type="text" id="correosCopia" placeholder="ejemplo@banco.com.ar">
            </div>

            <div class="form-group">
                <label>Fecha de publicación de la Circular Reservada</label>
                <input type="date" id="fechaPublicacion">
            </div>

            <hr class="divider">

            <!-- SECCIÓN 2: Proceso y Ámbito -->
            <div class="form-group">
                <label>Indique el proceso o producto relacionado con la Circular Reservada <span class="required">*</span></label>
                <input type="text" id="procesoProducto" required>
            </div>

            <div class="form-group">
                <label>¿La Circular Reservada afecta Unidades de Información o sólo un asunto? <span class="required">*</span></label>
                <select id="afectaUnidades" required>
                    <option value="" disabled selected>Buscar elementos</option>
                    <option value="Unidades de Información">Unidades de Información</option>
                    <option value="Sólo un asunto">Sólo un asunto</option>
                </select>
            </div>

            <div class="form-group">
                <label>Detalle la/s Unidad/es de Información o el asunto <span class="required">*</span></label>
                <input type="text" id="detalleUnidades" required>
            </div>

            <div class="form-group">
                <label>¿A qué ámbito de aplicación corresponde la Circular Reservada? <span class="required">*</span></label>
                <select id="ambitoAplicacion" required>
                    <option value="" disabled selected>Buscar elementos</option>
                    <option value="Nacional">Nacional</option>
                    <option value="Regional">Regional</option>
                    <option value="Sucursales Específicas">Sucursales Específicas</option>
                </select>
            </div>

            <hr class="divider">

            <!-- SECCIÓN 3: Redacción y Archivos Adjuntos -->
            <div class="form-group">
                <label class="section-label">Redacte el contenido de la Circular Reservada</label>
                
                <div class="editor-toolbar-custom">
                    <button type="button" class="btn-tool" onclick="abrirModalTabla()">📊 Insertar Tabla Excel</button>
                    <label for="uploadImage" class="btn-tool">🖼️ Cargar Imagen</label>
                    <input type="file" id="uploadImage" accept="image/*" style="display: none;" onchange="insertarImagen(event)">
                </div>
                
                <!-- El Editor TinyMCE -->
                <textarea id="editor"></textarea>
            </div>

            <div class="form-group">
                <label>Indique la ruta de acceso en el menú</label>
                <input type="text" id="rutaAcceso">
            </div>

            <div class="form-group">
                <label>¿Dónde pueden realizarse consultas sobre la Circular?</label>
                <input type="text" id="consultasCircular">
            </div>

            <div class="form-group">
                <label>Para el caso de que necesite subir un documento - pdf - word - excel - entre otros - el campo dispuesto a continuacion esta incluido a tal efecto</label>
                <div class="file-upload-box">
                    <input type="file" id="archivosAdjuntos" multiple>
                </div>
            </div>

            <hr class="divider">

            <div class="footer-actions">
                <button type="button" class="btn-submit" onclick="enviarFormulario()">Guardar y Enviar Circular</button>
            </div>

        </form>
    </div>

    <!-- Modal para Tablas -->
    <div id="modalTabla" class="modal">
        <div class="modal-content">
            <h3>Insertar Tabla (Estilo Excel)</h3>
            <div class="modal-body">
                <label>Filas: <input type="number" id="numFilas" value="3" min="1"></label>
                <label>Columnas: <input type="number" id="numCols" value="3" min="1"></label>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="cerrarModalTabla()">Cancelar</button>
                <button type="button" class="btn-submit" onclick="insertarTablaGenerada()">Insertar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
